name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Test
        run: bun run test:ci

      - name: Build
        run: bun run build

      - name: Bundle size check
        run: |
          SIZE=$(du -sb dist | cut -f1)
          echo "dist/ size: ${SIZE} bytes ($(echo "scale=1; $SIZE / 1024" | bc) KB)"
          MAX_SIZE=524288  # 512 KB
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "ERROR: dist/ exceeds ${MAX_SIZE} bytes ($SIZE bytes)"
            exit 1
          fi

      - name: Verify examples build
        run: |
          for dir in examples/*/; do
            if [ -f "${dir}package.json" ]; then
              echo "Building ${dir}..."
              (cd "$dir" && bun install --frozen-lockfile 2>/dev/null && bun run build 2>/dev/null) || echo "WARN: ${dir} build failed (may need library linked)"
            fi
          done
