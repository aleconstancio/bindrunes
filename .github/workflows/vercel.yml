name: Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build urupe-ui first — the showcase depends on it via workspace link.
      # Must build before vercel build so the dist/ output is available.
      - name: Build urupe-ui
        run: bunx turbo run build --filter=urupe-ui

      # vercel pull links the project and downloads env config.
      # vercel build uses this config to build the SvelteKit app.
      # --prebuilt avoids double-building (we already built above).
      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: examples/showcase

      - name: Build for Vercel
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: examples/showcase

      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        run: |
          URL=$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "## Vercel Preview" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to: $URL" >> $GITHUB_STEP_SUMMARY
        working-directory: examples/showcase

      - name: Deploy to Vercel (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          URL=$(npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "## Vercel Production" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to: $URL" >> $GITHUB_STEP_SUMMARY
        working-directory: examples/showcase
