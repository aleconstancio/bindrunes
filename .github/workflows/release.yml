name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run check
      - name: Tests
        run: bun run test:ci
      - name: Verify build
        run: |
          bun run build
          if find dist -name '*.test.*' -o -name '*.spec.*' | grep -q .; then
            echo "ERROR: test files leaked into dist/"
            find dist -name '*.test.*' -o -name '*.spec.*'
            exit 1
          fi

  release:
    name: Changesets Release
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create changesets PR or publish
        uses: changesets/action@v1
        with:
          publish: bun run release:publish
          title: "chore: version packages"
          commit: "chore: version packages"
          version: bun run release:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
